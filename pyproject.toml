[project]
name = "project-diwan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wandrilled", email = "wandrille.dorchies@eleve.ensai.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pathlib>=1.0.1",
    "scikit-image>=0.26.0",
    "simpleitk>=2.5.7",
    "torch>=2.15.0",
]

[project.scripts]
project-diwan = "project_diwan:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
]
